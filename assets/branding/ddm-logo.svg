<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">DDM Electronics</title>
  <desc id="desc">DDM Electronics gold emblem with Since 1999</desc>
  <defs>
